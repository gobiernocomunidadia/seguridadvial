<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguridad Vial | Municipio de Lomas de Zamora</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PapaParse para procesar CSV ágilmente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- Google Font: Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        // Configuración de Tailwind para alinear con el manual de marca (PDF)
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Montserrat', 'sans-serif'] },
                    colors: {
                        institucional: {
                            petroleo: '#1E6F99',
                            medio: '#35A4D4',
                            celeste: '#34BBEB',
                            fucsia: '#DF4172'
                        }
                    },
                    borderRadius: {
                        'xl': '12px', // Obligatorio según PDF
                    }
                }
            }
        }
    </script>

    <style>
        body {
            /* Fondo gradiente extraído de la referencia de Ceamse */
            background: linear-gradient(90deg, #1E6F99 0%, #35A4D4 50%, #34BBEB 100%);
            background-attachment: fixed;
        }
        .card-kpi {
            /* Borde izquierdo destacado y sombra suave (Regla UI PDF) */
            border-left: 6px solid #DF4172;
            transition: transform 0.2s ease;
        }
        .card-kpi:hover {
            transform: translateY(-2px);
        }
        /* Loader simple */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #DF4172; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col">

    <!-- Navbar / Header -->
    <header class="w-full p-6 text-white flex justify-between items-center shadow-md bg-black/10">
        <div>
            <h1 class="text-2xl font-bold tracking-wide">Seguridad Vial</h1>
            <p class="text-sm font-medium opacity-90">Resumen Diario de Operaciones</p>
        </div>
        <div id="loading-indicator" class="hidden flex items-center space-x-2 bg-white/20 px-4 py-2 rounded-xl">
            <div class="loader"></div>
            <span class="text-sm font-semibold">Actualizando datos...</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow p-6 max-w-7xl mx-auto w-full flex flex-col gap-6">

        <!-- Controles y Filtros -->
        <section class="flex flex-col md:flex-row justify-between items-center bg-white/10 p-4 rounded-xl backdrop-blur-sm border border-white/20">
            <div class="w-full md:w-1/3">
                <label for="cgm-filter" class="block text-sm font-semibold text-white mb-1">Filtrar por CGM / Delegación</label>
                <select id="cgm-filter" class="w-full bg-white text-institucional-petroleo font-bold rounded-xl p-3 outline-none shadow-sm cursor-pointer focus:ring-2 focus:ring-institucional-fucsia">
                    <option value="TODOS">Total General (Todos los CGM)</option>
                    <!-- Las opciones se inyectarán dinámicamente vía JS -->
                </select>
            </div>
            
            <div class="mt-4 md:mt-0 text-white text-right">
                <p class="text-sm opacity-80">Última actualización</p>
                <p class="font-semibold" id="last-update">--/--/----</p>
            </div>
        </section>

        <!-- Bloque Modular de KPIs -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- KPI: Incidentes -->
            <article class="card-kpi bg-white rounded-xl p-6 shadow-lg flex flex-col justify-between">
                <div class="flex justify-between items-start">
                    <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider">Incidentes Vía Pública</h2>
                    <svg class="w-6 h-6 text-institucional-fucsia" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                </div>
                <div class="mt-4">
                    <span id="kpi-incidentes" class="text-5xl font-extrabold text-institucional-petroleo">0</span>
                </div>
            </article>

            <!-- KPI: Semáforos -->
            <article class="card-kpi bg-white rounded-xl p-6 shadow-lg flex flex-col justify-between">
                <div class="flex justify-between items-start">
                    <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider">Semáforos Activos</h2>
                    <svg class="w-6 h-6 text-institucional-medio" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                </div>
                <div class="mt-4">
                    <span id="kpi-semaforos" class="text-5xl font-extrabold text-institucional-petroleo">0</span>
                </div>
            </article>

            <!-- KPI: Reductores -->
            <article class="card-kpi bg-white rounded-xl p-6 shadow-lg flex flex-col justify-between">
                <div class="flex justify-between items-start">
                    <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider">Reductores de Velocidad</h2>
                    <svg class="w-6 h-6 text-institucional-celeste" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <div class="mt-4">
                    <span id="kpi-reductores" class="text-5xl font-extrabold text-institucional-petroleo">0</span>
                </div>
            </article>

        </section>

        <!-- Contenedor para Escalabilidad Futura (Tablas / Mapas) -->
        <section id="contenedor-graficos" class="bg-white rounded-xl p-6 shadow-lg mt-4 hidden">
            <h3 class="text-lg font-bold text-institucional-petroleo mb-4 border-b pb-2">Detalle por zonas (Próximamente)</h3>
            <!-- Aquí pueden inyectar Chart.js o una tabla de DataTables -->
        </section>

    </main>

    <script>
        // ==========================================
        // ESQUELETO BASE - LÓGICA A INTEGRAR VÍA GITHUB
        // ==========================================

        // Referencias al DOM listas para usar
        const DOM = {
            loader: document.getElementById('loading-indicator'),
            selectCGM: document.getElementById('cgm-filter'),
            kpiIncidentes: document.getElementById('kpi-incidentes'),
            kpiSemaforos: document.getElementById('kpi-semaforos'),
            kpiReductores: document.getElementById('kpi-reductores'),
            lastUpdate: document.getElementById('last-update')
        };

        function initDashboard() {
            console.log("Estructura UI cargada. Esperando vinculación de datos externa...");
            
            // Seteo de fecha base
            DOM.lastUpdate.innerText = new Date().toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
            
            // TODO: Inyectar lógica de carga de CSV y GeoJSONs
        }

        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
