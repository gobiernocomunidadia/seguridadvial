<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agencia de Seguridad Vial - Lomas de Zamora</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fuentes e Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-main: #19567C;
            --blanco: #FFFFFF;
            --acento: #4AB5E0;
            --magenta: #D34872;
            --azul-inst: #19567C;
        }

        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-main); color: var(--blanco); margin: 0; min-height: 100vh; }
        
        #map { height: 100%; width: 100%; border-radius: 8px; background-color: #f8fafc; z-index: 10; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #F3F6F9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E6EDF3; border-radius: 4px; }

        /* Ajustes para la ventana de Info de Google Maps para que parezca Leaflet */
        .gm-style-iw.gm-style-iw-c {
            border-radius: 8px !important;
            padding: 12px !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06) !important;
        }
        .gm-style-iw-d { overflow: hidden !important; }
        button.gm-ui-hover-effect { display: none !important; /* Ocultar la cruz por defecto fea de google */ }
    </style>
</head>
<body class="flex flex-col">

    <header class="bg-[var(--bg-main)] shadow-lg border-b-4 border-[var(--acento)] z-20 py-6 px-4 shrink-0">
        <div class="max-w-[1600px] mx-auto flex items-center justify-center gap-4">
            <div class="bg-white text-[var(--bg-main)] rounded-full h-14 w-14 flex items-center justify-center shadow-md">
                <i class="fa-solid fa-car text-2xl"></i>
            </div>
            <div class="flex flex-col">
                <h1 class="text-3xl font-extrabold tracking-tight uppercase leading-none">Agencia de Seguridad Vial</h1>
            </div>
        </div>
    </header>

    <main class="w-full max-w-[1600px] mx-auto py-8 px-4 flex-1 flex flex-col lg:flex-row gap-6">
        
        <aside class="w-full lg:w-80 bg-white rounded-xl shadow-md border border-[#E6EDF3] flex flex-col max-h-[calc(100vh-200px)] overflow-hidden shrink-0 z-20">
            <div class="p-4 border-b bg-[#F3F6F9] flex items-center gap-2">
                <i data-lucide="filter" class="text-[#0B5F8D] h-5 w-5"></i>
                <h3 class="font-bold text-[#0F172A] uppercase text-sm">Filtros Operativos</h3>
            </div>
            
            <div class="p-5 overflow-y-auto custom-scrollbar flex-1 space-y-6">
                
                <!-- SECCIÓN: DIVISIÓN TERRITORIAL -->
                <div class="bg-[#19567C]/10 p-3 rounded-lg border border-[#19567C]/30">
                    <h4 class="text-xs font-extrabold text-[#19567C] uppercase mb-3 flex items-center gap-2">
                        <i data-lucide="map" class="h-4 w-4"></i> División Territorial
                    </h4>
                    <div class="space-y-3">
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" id="cb-limite" checked class="w-4 h-4 accent-[#19567C]">
                            <span class="text-sm text-[#0F172A] font-bold">Límite Lomas de Zamora</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" id="cb-cgm" checked class="w-4 h-4 accent-[#19567C]">
                            <span class="text-sm text-[#0F172A] font-bold">División por CGM</span>
                        </label>
                    </div>
                </div>

                <!-- SECCIÓN: INFRAESTRUCTURA VIAL -->
                <div class="bg-[#19567C]/10 p-3 rounded-lg border border-[#19567C]/30">
                    <h4 class="text-xs font-extrabold text-[#19567C] uppercase mb-3 flex items-center gap-2">
                        <i data-lucide="cone" class="h-4 w-4"></i> Infraestructura Vial
                    </h4>
                    <div class="space-y-3">
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" id="cb-semaforos" class="w-4 h-4 accent-[#19567C]">
                            <span class="text-sm text-[#0F172A] font-bold">Semáforos Activos</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" id="cb-reductores" class="w-4 h-4 accent-[#19567C]">
                            <span class="text-sm text-[#0F172A] font-bold">Reductores de Velocidad</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" id="cb-solicitudes" class="w-4 h-4 accent-[#19567C]">
                            <span class="text-sm text-[#0F172A] font-bold">Solicitudes Semáforos 2026</span>
                        </label>
                    </div>
                </div>

                <!-- SECCIÓN: TRÁFICO -->
                <div class="bg-[#4AB5E0]/10 p-3 rounded-lg border border-[#4AB5E0]/30">
                    <h4 class="text-xs font-extrabold text-[#19567C] uppercase mb-3 flex items-center gap-2">
                        <i data-lucide="activity" class="h-4 w-4"></i> Tráfico
                    </h4>
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" id="cb-trafico" class="w-4 h-4 accent-[#4AB5E0]">
                        <span class="text-sm text-[#0F172A] font-bold">Ver Tráfico Real</span>
                    </label>
                </div>

            </div>
        </aside>

        <div class="flex-1 bg-white p-2 rounded-xl shadow-lg border border-[#E6EDF3] flex flex-col min-h-[500px] relative z-10">
            <div id="map"></div>
        </div>

    </main>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB2MHti5Cy4IDKPc3Iu0ypNQg_BgsjcMoQ&callback=initMap" defer></script>

    <script>
        let map, trafficLayer, infoWindow;
        let limiteLayer, cgmLayer, semaforosLayer, reductoresLayer, solicitudesLayer;

        function initMap() {
            lucide.createIcons();
            infoWindow = new google.maps.InfoWindow();
            
            // Estilo claro minimalista simulando Leaflet CartoDB
            const mapStyle = [
                { featureType: "poi", stylers: [{ visibility: "off" }] },
                { featureType: "transit", stylers: [{ visibility: "off" }] },
                { elementType: "geometry", stylers: [{ color: "#f5f5f5" }] },
                { elementType: "labels.icon", stylers: [{ visibility: "off" }] },
                { elementType: "labels.text.fill", stylers: [{ color: "#616161" }] },
                { elementType: "labels.text.stroke", stylers: [{ color: "#f5f5f5" }] },
                { featureType: "water", elementType: "geometry", stylers: [{ color: "#c9e8f5" }] },
                { featureType: "water", elementType: "labels.text.fill", stylers: [{ color: "#9e9e9e" }] }
            ];

            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: -34.7573, lng: -58.4035 },
                zoom: 13,
                styles: mapStyle,
                mapTypeControl: false,
                streetViewControl: false
            });

            // 1. CAPA: Límite Distrital
            limiteLayer = new google.maps.Data();
            limiteLayer.loadGeoJson('./municipios_Lomas de Zamora.geojson'); 
            limiteLayer.setStyle({
                fillColor: '#19567C',
                fillOpacity: 0.02,
                strokeColor: '#19567C',
                strokeWeight: 4,
                strokeOpacity: 0.8,
                zIndex: 2
            });
            limiteLayer.setMap(map);

            // 2. CAPA: División por CGM
            cgmLayer = new google.maps.Data();
            cgmLayer.loadGeoJson('./CGM.geojson');
            cgmLayer.setStyle({
                fillColor: '#4AB5E0',
                fillOpacity: 0.25,
                strokeColor: '#FFFFFF',
                strokeWeight: 1.5,
                strokeOpacity: 1,
                zIndex: 1
            });
            cgmLayer.setMap(map);

            // 3, 4, 5. CAPAS DE PUNTOS
            semaforosLayer = new google.maps.Data();
            semaforosLayer.loadGeoJson('./Semaforos Activos.geojson');
            
            reductoresLayer = new google.maps.Data();
            reductoresLayer.loadGeoJson('./Reductores de Velocidad.geojson');
            
            solicitudesLayer = new google.maps.Data();
            solicitudesLayer.loadGeoJson('./Solicitudes Semaforos 2026.geojson');

            // --- LÓGICA DE ESTILOS DINÁMICOS CON SVG ---
            // Rutas vectoriales (similares a Lucide/FontAwesome) para cada categoría
            const pathSemaforo = '<rect x="7" y="2" width="10" height="20" rx="3"/><circle cx="12" cy="7" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="17" r="1.5"/>';
            const pathReductor = '<path d="m20.9 18.55-8-15.98a1 1 0 0 0-1.8 0l-8 15.98"/><path d="M4.34 10a11.24 11.24 0 0 1 15.32 0"/><path d="M8.64 14.5a5.42 5.42 0 0 1 6.72 0"/><path d="M2 22h20"/>';
            const pathSolicitud = '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15h6"/>';

            // Función para renderizar el círculo con el ícono adentro
            function getSvgIcon(color, iconPath, size) {
                // Generamos un SVG con el círculo de fondo institucional y el ícono blanco en el centro
                const svg = `
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="${size}" height="${size}">
                        <circle cx="16" cy="16" r="15" fill="${color}" stroke="#FFFFFF" stroke-width="2"/>
                        <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(6, 6) scale(0.83)">
                            ${iconPath}
                        </g>
                    </svg>
                `;
                return {
                    url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
                    scaledSize: new google.maps.Size(size, size),
                    anchor: new google.maps.Point(size/2, size/2) // Centra exactamente el ícono en la coordenada
                };
            }

            function updatePointStyles() {
                const zoom = map.getZoom();
                // Tamaños dinámicos del ícono según nivel de zoom en píxeles
                let size = 14;   
                if (zoom >= 15) { size = 28; }       
                else if (zoom >= 13) { size = 20; } 

                semaforosLayer.setStyle({ icon: getSvgIcon('#19567C', pathSemaforo, size), zIndex: 10 });
                reductoresLayer.setStyle({ icon: getSvgIcon('#D34872', pathReductor, size), zIndex: 10 });
                solicitudesLayer.setStyle({ icon: getSvgIcon('#4AB5E0', pathSolicitud, size), zIndex: 10 });
            }

            // Escuchar cambios en el zoom para redimensionar los puntos
            map.addListener('zoom_changed', updatePointStyles);
            updatePointStyles(); // Aplicar estilo inicial

            // --- LÓGICA DE VENTANAS EMERGENTES (POPUPS) ---
            function bindPopup(layer, colorTitle, defaultTitle, isPolygon) {
                layer.addListener('click', function(event) {
                    const p = event.feature.getProperty;
                    const name = event.feature.getProperty('Name') || event.feature.getProperty('nombre') || defaultTitle;
                    
                    let content = `<div style="font-family: 'Montserrat', sans-serif; min-width: 180px;">`;
                    
                    if (isPolygon) {
                        const cgm = event.feature.getProperty('CGM');
                        content += `<h3 style="font-weight: 800; font-size: 14px; color: ${colorTitle}; border-bottom: 1px solid #E6EDF3; padding-bottom: 4px; margin-bottom: 8px;">CGM: ${cgm}</h3>`;
                        content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Manzanas:</b> ${event.feature.getProperty('Manzanas') || '-'}</p>`;
                        content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Cuadras:</b> ${event.feature.getProperty('Cuadras') || '-'}</p>`;
                        content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Viviendas:</b> ${event.feature.getProperty('Viviendas') || '-'}</p>`;
                    } else {
                        content += `<h3 style="font-weight: 800; font-size: 14px; color: ${colorTitle}; border-bottom: 1px solid #E6EDF3; padding-bottom: 4px; margin-bottom: 8px;">${name}</h3>`;
                        if (event.feature.getProperty('description')) {
                            content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Detalle:</b> ${event.feature.getProperty('description')}</p>`;
                        }
                        if (event.feature.getProperty('CGM')) {
                            content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>CGM:</b> ${event.feature.getProperty('CGM')}</p>`;
                        }
                    }
                    content += `</div>`;

                    infoWindow.setContent(content);
                    // Para polígonos, centrar el popup en el clic. Para puntos, centrar en la coordenada del punto.
                    infoWindow.setPosition(isPolygon ? event.latLng : event.feature.getGeometry().get());
                    infoWindow.open(map);
                });
            }

            bindPopup(cgmLayer, '#19567C', '', true);
            bindPopup(semaforosLayer, '#19567C', 'Semáforo Activo', false);
            bindPopup(reductoresLayer, '#D34872', 'Reductor de Velocidad', false);
            bindPopup(solicitudesLayer, '#4AB5E0', 'Solicitud 2026', false);

            // 6. CAPA: Tráfico
            trafficLayer = new google.maps.TrafficLayer();

            // --- LÓGICA DE CHECKBOXES ---
            const toggleLayer = (id, layerInstance) => {
                document.getElementById(id).addEventListener('change', (e) => {
                    e.target.checked ? layerInstance.setMap(map) : layerInstance.setMap(null);
                });
            };

            toggleLayer('cb-limite', limiteLayer);
            toggleLayer('cb-cgm', cgmLayer);
            toggleLayer('cb-semaforos', semaforosLayer);
            toggleLayer('cb-reductores', reductoresLayer);
            toggleLayer('cb-solicitudes', solicitudesLayer);
            toggleLayer('cb-trafico', trafficLayer);
        }
    </script>
</body>
</html>
